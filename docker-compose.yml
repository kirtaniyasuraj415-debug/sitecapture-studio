services:
  worker:
    image: sitecapture-studio-worker:local
    build:
      context: ./worker
      dockerfile: Dockerfile
    environment:
      PORT: 8787
      HOST: 0.0.0.0
      ALLOWED_ORIGINS: http://localhost:3000
      CAPTURE_CONCURRENCY: 1
      MAX_QUEUE_LENGTH: 20
      FILE_TTL_MS: 1800000
      MAX_PAGE_TRANSFER_BYTES: 104857600
      MAX_OUTPUT_FILE_BYTES: 262144000
      ENABLE_4K_VIDEO: "false"
      MAX_VIDEO_RENDER_PIXELS: 10000000
      MAX_SCREENSHOT_PIXELS: 100000000
    shm_size: "1gb"
    ports:
      - "8787:8787"
    restart: unless-stopped

  web:
    image: sitecapture-studio-web:local
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      CAPTURE_WORKER_URL: http://worker:8787
      CAPTURE_PUBLIC_WORKER_URL: http://localhost:8787
    depends_on:
      - worker
    ports:
      - "3000:3000"
    restart: unless-stopped
