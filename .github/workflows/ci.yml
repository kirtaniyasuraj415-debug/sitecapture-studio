name: Build and real capture verification
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CHROMIUM_NO_SANDBOX: 'true'
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            worker/package-lock.json
      - run: npm ci --no-audit --no-fund && npm --prefix worker ci --no-audit --no-fund
      - run: npm run lint && npm run build && npm run worker:build && npm test
      - run: cd worker && npx playwright install --with-deps chromium
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Deterministic engine cases and actual public websites
        run: npm --prefix worker run smoke
      - name: Mobile and desktop UI, real backend rejection/retry
        run: bash scripts/test-local.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: capture-verification
          path: artifacts/
          retention-days: 14
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build exact production images
        run: docker compose build
      - name: Start sandboxed production stack
        run: docker compose up -d --no-build
      - name: Wait for the frontend and worker
        run: |
          for attempt in {1..60}; do
            if curl -fsS http://127.0.0.1:3000/health >/dev/null; then exit 0; fi
            sleep 2
          done
          docker compose logs
          exit 1
      - name: Capture actual website through production APIs
        run: node scripts/api-check.mjs
      - name: Build single-container distribution
        run: docker build -f Dockerfile.single -t sitecapture-studio:single .
      - name: Show logs
        if: always()
        run: docker compose logs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: docker-verification
          path: artifacts/
          retention-days: 14
      - name: Cleanup
        if: always()
        run: docker compose down -v
