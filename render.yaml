# Explicit free plan; no card-based trial or paid resource is selected.
# 512 MB / 0.1 CPU is unsuitable for dependable high-resolution video.
services:
  - type: web
    name: sitecapture-studio
    runtime: docker
    dockerfilePath: ./Dockerfile.single
    dockerContext: .
    plan: free
    healthCheckPath: /health
    envVars:
      - key: CAPTURE_CONCURRENCY
        value: 1
      - key: MAX_QUEUE_LENGTH
        value: 2
      - key: MAX_PAGE_TRANSFER_BYTES
        value: 31457280
      - key: MAX_OUTPUT_FILE_BYTES
        value: 52428800
      - key: MAX_VIDEO_RENDER_PIXELS
        value: 2073600
      - key: MAX_SCREENSHOT_PIXELS
        value: 16000000
      - key: ENABLE_4K_VIDEO
        value: false
      - key: CHROMIUM_NO_SANDBOX
        value: false
      - key: SITE_PASSWORD
        sync: false
